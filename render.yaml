services:
  - type: web
    name: bug-resolution-agent
    runtime: docker
    plan: starter
    region: ohio
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8080"
      - key: Agent__ApiKey
        generateValue: true
      - key: Runner__Enabled
        value: "false"
    disk:
      name: agent-data
      mountPath: /data
      sizeGB: 1
